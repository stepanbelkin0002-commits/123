services:
  - type: web
    name: personal-tg-login
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
